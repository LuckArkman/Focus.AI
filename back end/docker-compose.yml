version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: focus_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: focus_ai_db
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/data/pg_data:/var/lib/postgresql/data
    networks:
      - focus_ai_network
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: focus_ai_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mysecretpassword
    ports:
      - "27017:27017"
    volumes:
      - ./.docker/data/mongo_data:/data/db
    networks:
      - focus_ai_network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: focus_ai_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./.docker/data/qdrant_data:/qdrant/storage
    networks:
      - focus_ai_network
    restart: unless-stopped

networks:
  focus_ai_network:
    driver: bridge
